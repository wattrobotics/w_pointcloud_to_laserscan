# Livox Mid-360S -> 2D LaserScan 변환 파라미터 (2D SLAM/Nav2, 수평 장착, 이동 로봇)
#
# '/**' 와일드카드를 사용하므로 노드 이름/네임스페이스와 무관하게 적용된다.
# 전제:
#   - /livox/lidar 가 sensor_msgs/PointCloud2 로 발행 (livox_ros_driver2 의 xfer_format=0)
#   - target_frame(base_link)으로의 TF 존재 (수평 장착이면 회전 0, 위치 오프셋만)
/**:
  ros__parameters:
    # 시뮬레이션/bag 재생 시 /clock 시간 사용 (SLAM/Nav2 와 시간 동기를 맞출 때 true).
    use_sim_time: false

    # 입력/출력 토픽 이름. (ROS remapping 을 쓰면 그쪽이 우선 적용됨)
    cloud_topic: "/livox/lidar"
    scan_topic: "/livox/lidar/scan"

    # 출력 좌표 프레임 (박스 필터/스캔 기준). TF 가 없으면 '' 로 두면 입력 cloud 프레임(livox_frame) 사용.
    target_frame: "base_link"
    transform_tolerance: 0.1

    # z 범위 (수평 슬라이스). 센서 수평면 기준 얇게 잡아 바닥/천장 배제. 현장 튜닝.
    # Mid-360S: baselink 기준 +0.942
    # Mid-360S: basefootprint 기준 +1.176
    min_height: 1.142
    max_height: 1.242

    # x/y 자가(self) 필터: 박스 "안쪽"의 점(=로봇 본체)을 제거. 기본 비활성.
    # 범위는 target_frame(base_link) 기준. base_link_joint 의 x/y 오프셋이 0 이라
    # base_footprint 기준 nav2 footprint 값을 그대로 쓸 수 있다.
    #
    # [2026-09-18] w_type_mw config/nav2/common_costmap.yaml 의 footprint
    #   (X -0.4310 ~ +0.4454, Y -0.2967 ~ +0.2797) + 사방 40mm 마진.
    #
    #   ★ 박스는 반드시 footprint 를 **포함**해야 한다. 직전 값(04678e1 "Update from
    #     mw2 R1": x -0.407~0.401, y ±0.250)은 footprint 보다 작아서 기체 테두리에
    #     필터가 안 걸리는 띠가 남았다 — 전방 44 / 후방 24 / 좌 30 / 우 47 mm.
    #     라이다(base_link x 0.2767, y 0.1465)에서 +Y 띠까지 103mm 라 range_min(0.10)
    #     을 넘겨 통과했고, 그 자기점이 collision_monitor 의 FootprintApproach 로
    #     직행해 주행 중 정지를 일으켰다(실기 관측). costmap 의 obstacle_layer 는
    #     footprint_clearing 으로 지우지만 collision_monitor 에는 그 개념이 없어서
    #     자기점에 대한 방어선이 이 박스 하나뿐이다.
    #   ※ 04678e1 이 왜 줄였는지는 커밋에 근거가 없다. 되돌릴 일이 생기면 git log 참고.
    use_self_filter: true
    self_x_min: -0.4710
    self_x_max: 0.4854
    self_y_min: -0.3367
    self_y_max: 0.3197

    # 2D 스캔 각도 (360°, 1° 해상도). 단일 프레임으로 빈 bin 거의 없음.
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.01745329   # 1 deg
    scan_time: 0.1                # 10 Hz

    # 반경 필터 + LaserScan 메시지 필드.
    range_min: 0.10               # (0,0,0) 미반환점 + 근접 노이즈 제거 (사양 최소 0.1m)
    range_max: 40.0               # Mid-360S 사양(10% 반사 40m)
    use_inf: true
    inf_epsilon: 1.0

    # Livox tag 노이즈 필터: (tag & mask)!=0 이면 제거.
    # 15(0x0F) = 공간노이즈(bit0-1)+강도노이즈(bit2-3). return-type 비트(4-7)는 유지.
    tag_filter_enable: true
    tag_filter_mask: 15

    queue_size: 10
